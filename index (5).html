<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingliz tili C1 · Uy vazifasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly homework workbook for Uzbek learners, calm and encouraging
   IDEA: a coursebook's unit pages turned into tick-off exercise cards
   PICTURE: the unit list itself, each card with its own colour and progress bar
   COLOUR and TYPE: book-blue header, white cards, one colour per unit; Nunito
   LAYOUT: single 760px column, tabs, cards; stacks naturally on phones */
:root{color-scheme:light dark;
--bg:light-dark(#f3f5fa,#0f1320);--card:light-dark(#fff,#181e2e);--ink:light-dark(#1d2433,#e7ebf5);
--mute:light-dark(#667085,#9aa3b8);--line:light-dark(#e3e7f0,#2a3248);--blue:#7b2f8f;--blue2:light-dark(#f4e9f7,#2e1f3d);
--ok:#16a34a;--okbg:light-dark(#e8f7ee,#123222);--bad:#dc2626;--badbg:light-dark(#fdecec,#3a1717)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
header{background:var(--blue);color:#fff;padding:26px max(5vw,16px) 28px}
.wrap{max-width:760px;margin:0 auto}
header h1{margin:0;font-size:clamp(24px,4.4vw,32px);line-height:1.15;font-weight:800;text-wrap:balance}
header h1 small{font-weight:600;font-size:.62em;opacity:.9}
header p{margin:6px 0 0;opacity:.92}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:99px;padding:8px 14px;font:700 14px Nunito,sans-serif;cursor:pointer;min-height:36px}
.pill:hover{background:rgba(255,255,255,.3)}
main{max-width:760px;margin:0 auto;padding:18px 16px 40px}
.card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,30,60,.08)}
label.h{font-weight:700;display:block;margin-bottom:8px}
input[type=text]{width:100%;font:16px Nunito,sans-serif;padding:11px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:46px}
input[type=text]:focus{outline:none;border-color:var(--blue)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .4s}
.meta{color:var(--mute);font-size:14px}
.unit{display:block;width:100%;text-align:left;border:0;cursor:pointer;font:inherit;color:inherit;border-left:7px solid var(--c);position:relative}
.unit:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(20,30,60,.12)}
.unit .k{color:var(--c);font-weight:800;font-size:13px}
.unit h2{margin:4px 0 6px;font-size:21px;line-height:1.25}
.unit h2 span,h1 .uz{font-weight:600;color:var(--mute);font-size:.8em}
h1 .uz{color:#fff;opacity:.85}
.unit .tp{color:var(--mute);font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
@media(max-width:560px){.tabs{grid-template-columns:1fr 1fr}}
.txt p{margin:0 0 12px;font-size:17px;line-height:1.7}
.gl{border:0;background:none;color:inherit;font:inherit;padding:0;border-bottom:2px dotted var(--blue);cursor:pointer}
.gl small{display:none;font-size:13px;color:var(--blue);font-weight:700;margin-left:4px}
.gl.on small{display:inline}
details summary{cursor:pointer;color:var(--blue);font-weight:800;margin-top:12px}
details p{color:var(--mute);font-size:15px}
.tf{display:flex;gap:8px}.tf .opt{flex:0 0 auto;min-width:100px;text-align:center}
h2.wt{font-size:22px;margin:4px 0 14px;line-height:1.25}h2.wt span{display:block;font-size:15px;color:var(--mute);font-weight:600}
.errs{display:flex;flex-wrap:wrap;gap:6px 4px;margin-bottom:12px}
.et{border:2px solid transparent;background:none;color:var(--ink);border-radius:8px;padding:4px 6px;font:17px Nunito,sans-serif;cursor:pointer;text-align:left}
.et:hover{border-color:var(--line)}
.et.sel{border-color:var(--blue);background:var(--blue2)}
.et .fx{display:block;font-size:13px;color:var(--ok);font-weight:800}
.model{background:light-dark(#f7f6f1,#1d2232);border-left:4px solid var(--blue);border-radius:10px;padding:12px 16px}
.model b{color:var(--blue)}.model p{margin:4px 0}
.ph{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.ph span{background:var(--blue2);border-radius:8px;padding:4px 10px;font-size:14px}
textarea{width:100%;min-height:220px;font:16px/1.6 Nunito,sans-serif;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--blue)}
.chk{list-style:none;padding:0;margin:10px 0}.chk li{padding:3px 0;color:var(--mute)}.chk li.y{color:var(--ok);font-weight:700}

.tab{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:10px;font:800 15px Nunito,sans-serif;cursor:pointer;min-height:44px}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
h3{margin:0 0 2px;font-size:19px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
h3 .st{font-size:13px;color:var(--mute);font-weight:700;white-space:nowrap}
h3 .st.done{color:var(--ok)}
.ins{font-style:italic;color:var(--mute);font-size:14px;margin-bottom:12px}
.rule{background:var(--blue2);border-radius:10px;padding:12px 14px;margin-bottom:6px;font-size:15px}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.w{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 8px;cursor:pointer;text-align:center;font:inherit;min-height:64px}
.w b{display:block;font-size:16px;line-height:1.25}.w span{font-size:13px;color:var(--mute);line-height:1.3;display:block;margin-top:2px}
.w:hover{border-color:var(--blue)}
.q{border-top:1px solid var(--line);padding:12px 0 4px}
.q .p{margin-bottom:8px}.q .p b{color:var(--blue);margin-right:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1 1 180px}
.btn{border:2px solid var(--blue);background:var(--blue);color:#fff;border-radius:10px;padding:0 16px;font:800 15px Nunito,sans-serif;cursor:pointer;min-height:46px}
.btn.o{background:var(--card);color:var(--blue)}
.opts{display:grid;gap:8px}
.opt{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 14px;text-align:left;font:16px Nunito,sans-serif;cursor:pointer;min-height:46px}
.opt:hover{border-color:var(--blue)}
.ok{border-color:var(--ok)!important;background:var(--okbg)!important}
.bad{border-color:var(--bad)!important;background:var(--badbg)!important}
.fb{font-size:14px;margin-top:6px;min-height:0}.fb.g{color:var(--ok)}.fb.r{color:var(--bad)}
.stage{font-weight:800;font-size:13px;color:var(--mute);margin:14px 0 6px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mt div{display:grid;gap:8px;align-content:start}
.mb{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 10px;font:15px Nunito,sans-serif;cursor:pointer;min-height:44px;text-align:center}
.mb.sel{border-color:var(--blue);background:var(--blue2)}
.mb.ok{opacity:.55;cursor:default}
.zone{min-height:50px;border:2px dashed var(--line);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tok{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 11px;font:16px Nunito,sans-serif;cursor:pointer;min-height:40px}
.zone .tok{border-color:var(--blue);background:var(--blue2)}
.tok.used{visibility:hidden}
.next{display:block;width:100%;margin-top:6px}
footer{text-align:center;color:var(--mute);font-size:14px;padding:0 16px 30px}
.reset{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:14px Nunito,sans-serif;margin-top:6px}
@media(max-width:480px){.row input{flex-basis:100%}.q .row .btn{flex:1}.mt{gap:6px}.mb{font-size:14px;padding:8px 6px}.bank{grid-template-columns:1fr 1fr}}
</style>
</head>

1:{R:{t:"In praise of slowness",
p:["We live in an age of speed. Emails demand instant replies, meals are eaten at our desks and even our holidays are packed with activities. Yet a growing number of people are deliberately choosing to slow down. The so-called Slow Movement, which began with a protest against a fast-food restaurant in Rome in the 1980s, now [encompasses|o‘z ichiga olmoq] everything from slow cooking to slow travel.",
"Its supporters argue that rushing makes us less productive, not more. ‘When we [multitask|bir vaqtda bir necha ish qilmoq], we do several things badly instead of one thing well,’ explains one time-management coach. With hindsight, many people realize that the decisions they made in a hurry were the ones they [regretted|afsuslanmoq] most.",
"[Critics|tanqidchilar], however, point out that slowing down is a luxury. A single parent working two jobs can hardly afford to spend three hours preparing dinner. Perhaps the real message is not that we should do everything slowly, but that we should choose our speed [consciously|ongli ravishda] – fast when we need to be, and slow when it [matters|muhim bo‘lmoq]."],
uz:["Biz tezlik davrida yashayapmiz. Elektron xatlar darhol javob talab qiladi, ovqat ish stoli ustida yeyiladi, hatto ta’tilimiz ham mashg‘ulotlarga to‘lib-toshgan. Shunga qaramay, tobora ko‘proq odamlar ataylab sekinlashishni tanlamoqda. 1980-yillarda Rimdagi fast-fud restoraniga qarshi norozilikdan boshlangan «Sekin harakat» deb ataluvchi oqim endi sekin pishirishdan tortib sekin sayohatgacha bo‘lgan hamma narsani o‘z ichiga oladi.","Uning tarafdorlari shoshilish bizni samaraliroq emas, balki kamroq samarali qiladi, deb ta’kidlashadi. «Bir vaqtda bir necha ish qilganimizda, bitta ishni yaxshi qilish o‘rniga bir nechtasini yomon qilamiz», — tushuntiradi vaqtni boshqarish bo‘yicha murabbiylardan biri. Orqaga nazar tashlab, ko‘pchilik shoshib qabul qilgan qarorlari eng ko‘p afsuslangan qarorlari ekanini anglaydi.","Biroq tanqidchilar sekinlashish hashamat ekanini ta’kidlaydi. Ikki joyda ishlaydigan yolg‘iz ota yoki ona kechki ovqatga uch soat sarflashga qodir emas. Ehtimol, asl xabar hamma narsani sekin qilishimiz kerak degani emas, balki tezligimizni ongli ravishda tanlashimiz kerak: zarur bo‘lganda tez, muhim bo‘lganda esa sekin."],

2:{R:{t:"The world’s greatest traveller",
p:["It weighs about 100 grams – less than a smartphone – yet the Arctic tern makes the longest [migration|ko‘chish] of any animal on Earth. Every year it flies from its breeding grounds in the Arctic to the Antarctic and back again, a round trip of around 70,000 kilometres. Over a lifetime of thirty years or more, that adds up to roughly three return journeys to the Moon.",
"How does such a small bird [accomplish|uddalamoq] such a remarkable feat? Scientists who attached tiny tracking devices to the birds found that they do not fly in a straight line. Instead, they follow a zigzag route, taking advantage of [prevailing|ustun keladigan] winds, which saves a great deal of energy. They also stop to feed in areas rich in fish.",
"Because it follows the summer from one end of the planet to the other, the Arctic tern sees more daylight than any other creature. Researchers are now deeply [concerned|xavotirda], however. Climate change is affecting the fish it depends on, and nobody knows how well this [extraordinary|favqulodda] traveller will be able to [adapt|moslashmoq]."],
uz:["Uning og‘irligi taxminan 100 gramm — smartfondan ham yengil — biroq Arktika chag‘alayi Yer yuzidagi har qanday hayvonning eng uzun ko‘chishini amalga oshiradi. Har yili u Arktikadagi uyalash joylaridan Antarktidaga va orqaga uchib boradi — bu taxminan 70 000 kilometrlik qatnov. O‘ttiz va undan ortiq yillik umri davomida bu Oyga taxminan uch marta borib kelishga teng.","Shunday kichik qush qanday qilib bunday ajoyib jasoratni uddalaydi? Qushlarga kichik kuzatuv qurilmalari biriktirgan olimlar ularning to‘g‘ri chiziq bo‘ylab uchmasligini aniqladi. Buning o‘rniga ular ustun keladigan shamollardan foydalanib, ilon izi yo‘ldan boradi, bu esa juda ko‘p energiyani tejaydi. Ular, shuningdek, baliqqa boy hududlarda oziqlanish uchun to‘xtashadi.","Yozni sayyoraning bir chetidan ikkinchisigacha kuzatib borgani uchun Arktika chag‘alayi boshqa har qanday jonzotdan ko‘ra ko‘proq kunduzgi yorug‘lik ko‘radi. Biroq tadqiqotchilar hozir qattiq xavotirda. Iqlim o‘zgarishi u bog‘liq bo‘lgan baliqlarga ta’sir qilmoqda va bu favqulodda sayyoh qanchalik yaxshi moslasha olishini hech kim bilmaydi."],
tf:[["The Arctic tern weighs less than a smartphone.",true],["It flies in a straight line to save time.",false],["It uses winds to save energy.",true],["Scientists are sure the bird will adapt to climate change.",false]],

3:{R:{t:"What makes a perfect team?",
p:["For years, managers assumed that the best teams were simply made up of the best people. Put the most talented [individuals|shaxslar] together, the logic went, and success would follow. Then, in 2012, Google decided to test this idea. A research project studied 180 of the company’s teams to find out why some [thrived|gullab-yashnamoq] while others failed.",
"The results surprised everyone. Who was on the team mattered far less than how the team worked together. The single most important factor turned out to be something the researchers called ‘psychological safety’: a shared belief that team members can take risks, ask questions and admit mistakes without being [embarrassed|xijolat qilmoq] or punished.",
"In teams with high psychological safety, everyone spoke roughly the same amount, and members were [sensitive|sezgir] to one another’s feelings. Nobody tried to be the centre of attention. Interestingly, these teams did not avoid [disagreement|kelishmovchilik]; they simply argued in a respectful way. The lesson is clear: a group of stars will not necessarily [outperform|ustun kelmoq] a group of ordinary people who trust each other."],
uz:["Yillar davomida menejerlar eng yaxshi jamoalar shunchaki eng yaxshi odamlardan tuzilgan deb hisoblashgan. Mantiq shunday edi: eng iqtidorli shaxslarni birlashtiring, muvaffaqiyat o‘z-o‘zidan keladi. Keyin, 2012-yilda Google bu g‘oyani sinab ko‘rishga qaror qildi. Tadqiqot loyihasi kompaniyaning 180 ta jamoasini o‘rganib, nima uchun ba’zilari gullab-yashnagani, boshqalari esa muvaffaqiyatsizlikka uchraganini aniqlashga harakat qildi.","Natijalar hammani hayratda qoldirdi. Jamoada kim borligi jamoa qanday birga ishlashidan ancha kamroq ahamiyatga ega edi. Eng muhim omil tadqiqotchilar «psixologik xavfsizlik» deb atagan narsa bo‘lib chiqdi: jamoa a’zolari xijolat bo‘lmasdan yoki jazolanmasdan tavakkal qilishi, savol berishi va xatolarini tan olishi mumkinligiga umumiy ishonch.","Psixologik xavfsizligi yuqori jamoalarda hamma taxminan bir xil miqdorda gapirgan va a’zolar bir-birining his-tuyg‘ulariga sezgir bo‘lgan. Hech kim diqqat markazida bo‘lishga urinmagan. Qizig‘i shundaki, bu jamoalar kelishmovchilikdan qochmagan; ular shunchaki hurmat bilan bahslashgan. Saboq aniq: yulduzlar guruhi bir-biriga ishonadigan oddiy odamlar guruhidan albatta ustun kelavermaydi."],
tf:[["Google studied 180 of its own teams.",true],["The most talented teams were always the most successful.",false],["In the best teams, people spoke roughly equally.",true],["Successful teams never disagreed.",false]],
q:[["What did managers believe before the study?","The best teams are made of the best people.","Teams should be small.","Psychological safety is most important."],["What is ‘psychological safety’?","Feeling able to take risks and admit mistakes.","Working in a safe building.","Having a strict manager."],["What is the main lesson of the text?","Trust matters more than individual talent.","Stars always win.","Teams should avoid arguments."]],
fw:[["shaxslar","individuals"],["kelishmovchilik","disagreement"],["sezgir","sensitive"],["ustun kelmoq","outperform"]]},

4:{R:{t:"Too young to care?",
p:["Seventeen-year-old Madina gets up at six every morning, but not to study. First she helps her grandmother, who has dementia, to get dressed and take her medicine. Only then does she leave for school. Madina is one of thousands of young carers – children and teenagers who look after a family member who is ill or [disabled|nogiron].",
"Experts say young carers are often [invisible|ko‘rinmas]. Teachers may notice that a student is tired or frequently late without knowing the reason. ‘Many young carers don’t talk about their situation because they feel [ashamed|uyalmoq] or worry that their family will be split up,’ explains a social worker in Tashkent.",
"Caring can have serious consequences: young carers are more likely to miss school and less likely to go to university. Yet it can also develop [maturity|yetuklik], patience and a strong sense of responsibility. Madina wants to become a nurse. ‘I’ve learnt things no textbook could teach me,’ she says. Campaigners argue that schools ought to identify young carers early and offer flexible [support|ko‘mak], so that responsibility doesn’t come at the cost of a [childhood|bolalik]."],
uz:["O‘n yetti yoshli Madina har kuni ertalab soat oltida turadi, lekin o‘qish uchun emas. Avval u demensiyaga chalingan buvisiga kiyinish va dori ichishda yordam beradi. Shundan keyingina maktabga jo‘naydi. Madina — minglab yosh qarovchilardan biri, ya’ni kasal yoki nogiron oila a’zosiga qaraydigan bolalar va o‘smirlar.","Mutaxassislarning aytishicha, yosh qarovchilar ko‘pincha ko‘rinmas bo‘ladi. O‘qituvchilar o‘quvchining charchaganini yoki tez-tez kechikishini payqashi mumkin, lekin sababini bilmaydi. «Ko‘plab yosh qarovchilar o‘z ahvoli haqida gapirmaydi, chunki uyaladi yoki oilasi ajratib yuborilishidan qo‘rqadi», — tushuntiradi Toshkentdagi ijtimoiy xodim.","G‘amxo‘rlik jiddiy oqibatlarga olib kelishi mumkin: yosh qarovchilar maktabni ko‘proq qoldiradi va universitetga kamroq kiradi. Ammo u yetuklik, sabr va kuchli mas’uliyat hissini ham rivojlantirishi mumkin. Madina hamshira bo‘lmoqchi. «Men hech bir darslik o‘rgata olmaydigan narsalarni o‘rgandim», — deydi u. Faollar maktablar yosh qarovchilarni erta aniqlashi va moslashuvchan ko‘mak berishi kerak, toki mas’uliyat bolalik hisobiga kelmasin, deb ta’kidlashadi."],
tf:[["Madina looks after her grandmother before school.",true],["Teachers always know which students are young carers.",false],["Young carers are less likely to go to university.",true],["Madina wants to become a teacher.",false]],
q:[["Why don’t many young carers talk about their situation?","They feel ashamed or are afraid for their family.","They are too busy studying.","Nobody asks them."],["What positive effect of caring is mentioned?","It can develop maturity and responsibility.","It improves exam results.","It makes young people richer."],["What do campaigners want schools to do?","identify young carers early and support them","stop young people from caring","give them extra homework"]],
fw:[["nogiron","disabled"],["ko‘rinmas","invisible"],["yetuklik","maturity"],["ko‘mak","support"]]},

5:{R:{t:"The power of a hashtag",
p:["In 2014, a simple video challenge spread across social media. People filmed themselves pouring a bucket of ice-cold water over their heads and then [nominated|nomzod qilib ko‘rsatmoq] three friends to do the same. Within weeks, millions had taken part, including politicians and film stars, and the campaign had raised well over $100 million for research into a rare disease.",
"What made it so successful? Experts point to a combination of factors, the most important of which was that it was fun. Unlike most charity appeals, it did not rely on making people feel guilty. It was also personal: being [challenged|chaqirilmoq] by a friend is far harder to ignore than an advert. And it was easy to copy, which allowed it to spread [exponentially|eksponensial, juda tez].",
"Critics, however, accused participants of ‘slacktivism’ – supporting a cause in a way that requires little effort and is mainly about [showing off|o‘zini ko‘rsatish]. Many people, they argued, did the challenge without ever donating. Yet the money raised [funded|moliyalashtirmoq] research that led to a significant scientific discovery. Perhaps the real power of social media lies not in changing minds, but in turning small actions into something much bigger."],
uz:["2014-yilda ijtimoiy tarmoqlarda oddiy video-chaqiriq tarqaldi. Odamlar boshlaridan bir chelak muzdek suv quyib o‘zlarini suratga olishgan, so‘ng uchta do‘stini ham shuni qilishga nomzod qilib ko‘rsatishgan. Bir necha hafta ichida millionlab odamlar, jumladan siyosatchilar va kino yulduzlari ishtirok etdi, kampaniya esa noyob kasallikni tadqiq qilish uchun 100 million dollardan ancha ko‘p mablag‘ to‘pladi.","Uni nima bunchalik muvaffaqiyatli qildi? Mutaxassislar bir qancha omillar uyg‘unligini ko‘rsatadi, ularning eng muhimi — bu qiziqarli edi. Ko‘pchilik xayriya murojaatlaridan farqli o‘laroq, u odamlarni aybdor his qildirishga tayanmadi. U shaxsiy ham edi: do‘st tomonidan chaqirilishni e’tiborsiz qoldirish reklamaga qaraganda ancha qiyin. Va uni takrorlash oson edi, bu esa juda tez tarqalishiga imkon berdi.","Biroq tanqidchilar ishtirokchilarni «slaktivizm»da, ya’ni kam kuch talab qiladigan va asosan o‘zini ko‘rsatishga qaratilgan qo‘llab-quvvatlashda aybladi. Ularning fikricha, ko‘pchilik hech qachon xayriya qilmasdan chaqiriqni bajargan. Shunday bo‘lsa-da, to‘plangan pul muhim ilmiy kashfiyotga olib kelgan tadqiqotni moliyalashtirdi. Ehtimol, ijtimoiy tarmoqlarning haqiqiy kuchi fikrlarni o‘zgartirishda emas, balki kichik harakatlarni ancha kattaroq narsaga aylantirishdadir."],
tf:[["Participants nominated three friends.",true],["The campaign made people feel guilty.",false],["Critics said some people took part without donating.",true],["The money raised did not lead to any results.",false]],
q:[["What was the most important reason for the campaign’s success?","It was fun.","It was organized by the government.","It was expensive."],["What is ‘slacktivism’?","supporting a cause with very little effort","working very hard for charity","refusing to use social media"],["What does the writer conclude?","Social media can turn small actions into something big.","Social media campaigns never work.","Charities should stop using social media."]],
fw:[["nomzod qilib ko‘rsatmoq","nominated"],["moliyalashtirmoq","funded"],["o‘zini ko‘rsatish","showing off"],["juda tez (eksponensial)","exponentially"]]},
W:{t:"Emphasis: inversion and cleft sentences",uz:"Urg‘u beruvchi tuzilmalar bilan maqola",

6:{R:{t:"Can games save the planet?",
p:["Most people would rather not think of video games as useful. They are usually [blamed|ayblanmoq] for keeping young people indoors and away from real life. But a number of scientists believe that games could help to solve some of the world’s most complex problems.",
"In one well-known example, an online puzzle game asked players to fold the shapes of [proteins|oqsillar] – a task that computers find extremely difficult. Within weeks, ordinary gamers with no scientific training had solved a problem that had puzzled researchers for over a decade. Other ‘citizen science’ games ask players to [classify|tasniflamoq] galaxies, count animals in photos from African [reserves|qo‘riqxonalar] or map the connections in the human brain.",
"Why does it work? Games are designed to keep us motivated: they set clear goals, give instant feedback and reward progress. Humans are also still better than machines at [spotting|payqab olmoq] patterns. Of course, playing a game won’t stop climate change on its own. But if even a small [fraction|kichik qismi] of the billions of hours spent gaming each week could be directed towards real problems, the results might be remarkable."],
uz:["Ko‘pchilik video o‘yinlarni foydali deb o‘ylamaslikni afzal ko‘radi. Ular odatda yoshlarni uyda ushlab, real hayotdan uzoqlashtirgani uchun ayblanadi. Biroq bir qator olimlar o‘yinlar dunyoning eng murakkab muammolaridan ba’zilarini hal qilishga yordam berishi mumkin, deb hisoblaydi.","Mashhur misollardan birida onlayn jumboq o‘yini o‘yinchilardan oqsillar shaklini buklashni so‘radi — bu kompyuterlar uchun o‘ta qiyin vazifa. Bir necha hafta ichida hech qanday ilmiy tayyorgarligi bo‘lmagan oddiy o‘yinchilar tadqiqotchilarni o‘n yildan ortiq qiynab kelgan muammoni hal qilishdi. Boshqa «fuqarolar ilmi» o‘yinlari o‘yinchilardan galaktikalarni tasniflash, Afrika qo‘riqxonalaridan olingan suratlardagi hayvonlarni sanash yoki inson miyasidagi bog‘lanishlar xaritasini tuzishni so‘raydi.","Nega bu ishlaydi? O‘yinlar bizni rag‘batlantirib turishga mo‘ljallangan: ular aniq maqsad qo‘yadi, darhol javob beradi va yutuqni taqdirlaydi. Bundan tashqari, odamlar naqshlarni payqashda hali ham mashinalardan ustun. Albatta, o‘yin o‘ynash o‘z-o‘zidan iqlim o‘zgarishini to‘xtatmaydi. Ammo har hafta o‘yinga sarflanadigan milliardlab soatlarning hatto kichik bir qismi haqiqiy muammolarga yo‘naltirilsa, natijalar ajoyib bo‘lishi mumkin."],
tf:[["Video games are often criticized for keeping young people indoors.",true],["The protein puzzle was solved by professional scientists.",false],["Humans are still better than computers at spotting patterns.",true],["The writer believes games alone can stop climate change.",false]],
q:[["What did gamers manage to do in the protein game?","solve a problem that had puzzled scientists","design a new computer","discover a new galaxy"],["Why are games good at keeping people motivated?","They give clear goals, feedback and rewards.","They are always free.","They are very short."],["What is the writer’s attitude towards games?","cautiously optimistic","completely negative","not interested"]],
fw:[["ayblanmoq","blamed"],["tasniflamoq","classify"],["payqab olmoq","spotting"],["kichik qismi","fraction"]]},

7:{R:{t:"Should you trust your gut?",
p:["We like to think of ourselves as rational beings who weigh up the evidence before making decisions. In reality, psychologists say, most of our choices are made [instantly|bir zumda] and emotionally, and our reasoning comes afterwards to [justify|oqlamoq] them. So should we trust our gut feelings, or ignore them?",
"The answer seems to depend on [expertise|tajriba, malaka]. Experienced firefighters, chess players and nurses often make excellent split-second decisions without being able to explain why. Their ‘intuition’ is really years of experience processed unconsciously. Had they stopped to analyse every detail, they might well have been too late.",
"In unfamiliar situations, however, gut feelings can be [misleading|chalg‘ituvchi]. We tend to trust people who look or sound like us, and we overestimate risks that are [vivid|yorqin, ko‘z oldida turadigan], such as plane crashes, while ignoring more common dangers. The best approach, experts suggest, is to listen to our emotions but to [question|shubha ostiga olmoq] them, especially when the stakes are high. If only we did this more often, we might make far fewer decisions we later regret."],
uz:["Biz o‘zimizni qaror qabul qilishdan oldin dalillarni tortib ko‘radigan aqlli mavjudotlar deb o‘ylashni yaxshi ko‘ramiz. Psixologlarning aytishicha, aslida tanlovlarimizning aksariyati bir zumda va his-tuyg‘u asosida qilinadi, mulohazamiz esa keyin ularni oqlash uchun keladi. Xo‘sh, ichki sezgimizga ishonishimiz kerakmi yoki uni e’tiborsiz qoldirishimiz kerakmi?","Javob tajribaga bog‘liq ko‘rinadi. Tajribali o‘t o‘chiruvchilar, shaxmatchilar va hamshiralar ko‘pincha sababini tushuntira olmasdan bir lahzada ajoyib qarorlar qabul qiladi. Ularning «intuitsiyasi» aslida ongsiz ravishda qayta ishlangan yillar tajribasidir. Agar ular har bir tafsilotni tahlil qilish uchun to‘xtaganlarida, juda kech qolishlari mumkin edi.","Biroq notanish vaziyatlarda ichki sezgi chalg‘ituvchi bo‘lishi mumkin. Biz o‘zimizga o‘xshab ko‘rinadigan yoki gapiradigan odamlarga ishonishga moyilmiz, samolyot halokati kabi ko‘z oldimizda turadigan xavflarni oshirib baholaymiz va keng tarqalgan xavflarni e’tiborsiz qoldiramiz. Mutaxassislarning fikricha, eng yaxshi yondashuv — his-tuyg‘ularimizni tinglash, ammo ularni shubha ostiga olish, ayniqsa xatar katta bo‘lganda. Qani endi buni tez-tez qilsak, keyinchalik afsuslanadigan qarorlarimiz ancha kam bo‘lardi."],
tf:[["Psychologists say most decisions are made slowly and logically.",false],["Experienced firefighters often can’t explain their quick decisions.",true],["Gut feelings are always reliable in new situations.",false],["We tend to overestimate dramatic risks like plane crashes.",true]],
q:[["When is intuition most reliable?","when a person has a lot of experience","when a situation is completely new","when we are very tired"],["What does ‘intuition’ really consist of, according to the text?","years of experience processed unconsciously","pure luck","a special gift some people are born with"],["What do experts recommend?","Listen to your emotions but question them.","Always ignore your feelings.","Always follow your gut."]],
fw:[["bir zumda","instantly"],["chalg‘ituvchi","misleading"],["oqlamoq","justify"],["shubha ostiga olmoq","question"]]},

8:{R:{t:"A year without plastic",
p:["When the Karimovs, a family of four from Tashkent, decided to spend a year without buying any new plastic, their friends laughed. ‘We had no idea how [dependent|qaram] we were on it,’ admits Nodira, the mother. ‘Looking back, we were incredibly naive.’",
"The first few weeks were the hardest. Almost everything in the supermarket was wrapped in plastic, so the family started shopping at the local bazaar, taking their own cloth bags and glass jars. Having given up bottled water, they bought a [filter|filtr] for the kitchen tap. Some things were impossible to replace: toothbrushes, for example, and medicines, which are bound to come in plastic [packaging|qadoq]. ‘We decided to be practical rather than [perfectionist|kamolotparast],’ says her husband, Bekzod.",
"By the end of the year, the family had reduced their rubbish by around 80%. Surprisingly, they also saved money, as they bought fewer [processed|qayta ishlangan] foods and cooked more at home. Not everything was positive – shopping took longer, and the children missed their favourite snacks. But none of them wants to go back. ‘It’s not about being perfect,’ Nodira explains. ‘It’s about [noticing|e’tibor bermoq] what we use and asking whether we really need it.’"],
uz:["Toshkentlik to‘rt kishilik Karimovlar oilasi bir yil davomida yangi plastik buyum sotib olmaslikka qaror qilganida, do‘stlari kulishdi. «Biz unga qanchalik qaram ekanimizni bilmagan ekanmiz, — tan oladi ona Nodira. — Orqaga qarasam, biz nihoyatda sodda edik.»","Dastlabki bir necha hafta eng og‘ir bo‘ldi. Supermarketdagi deyarli hamma narsa plastikka o‘ralgan edi, shuning uchun oila o‘z mato sumkalari va shisha bankalarini olib, mahalliy bozordan xarid qila boshladi. Butilkadagi suvdan voz kechib, ular oshxona jo‘mragi uchun filtr sotib olishdi. Ba’zi narsalarni almashtirishning iloji yo‘q edi: masalan, tish cho‘tkalari va albatta plastik qadoqda keladigan dorilar. «Biz kamolotparast emas, amaliy bo‘lishga qaror qildik», — deydi uning eri Bekzod.","Yil oxiriga kelib oila chiqindilarini taxminan 80% ga kamaytirdi. Ajablanarlisi, ular pulni ham tejashdi, chunki qayta ishlangan oziq-ovqatlarni kamroq sotib olib, uyda ko‘proq ovqat pishirishdi. Hammasi ham ijobiy emas edi — xarid ko‘proq vaqt oldi, bolalar esa sevimli gazaklarini sog‘inishdi. Ammo hech biri ortga qaytishni istamaydi. «Gap mukammal bo‘lishda emas, — tushuntiradi Nodira. — Gap nimadan foydalanayotganimizga e’tibor berish va bunga haqiqatan muhtojmizmi, deb so‘rashda.»"],
tf:[["The Karimovs’ friends supported the idea from the start.",false],["The family started shopping at the bazaar.",true],["They managed to replace absolutely everything plastic.",false],["The experiment helped them save money.",true]],
q:[["What did the family buy after giving up bottled water?","a filter for the kitchen tap","glass bottles of water","a new fridge"],["Why did they save money?","They bought fewer processed foods.","They stopped going shopping.","They sold their plastic items."],["What is Nodira’s main message?","Notice what you use and whether you need it.","Everyone must stop using plastic immediately.","Plastic is impossible to avoid."]],
fw:[["qaram","dependent"],["qadoq","packaging"],["qayta ishlangan","processed"],["e’tibor bermoq","noticing"]]},
W:{t:"A problem-solution-evaluation essay",uz:"Muammo–yechim–baho essesi",
err:"The purpose of this essay *is explore~is to explore* the problem of plastic waste. *There is several key problems~There are several key problems*. *Firstly of all~Firstly*, most plastic is not recycled.",
m:{h:"How can cities reduce plastic waste?",l:["The purpose of this essay is to explore the problem of plastic waste in cities and to evaluate possible solutions.","It would appear the main problem is that most plastic is used only once and then thrown away. Moreover, recycling facilities are limited.","One possible solution would be to introduce a charge for plastic bags. This has proved highly effective in many countries. However, it does not address other types of packaging.","A more far-reaching measure would be to require supermarkets to offer refill stations. Although this may be costly at first, it is likely to reduce waste substantially in the long term.","On balance, a combination of financial incentives and new regulations seems to be the most effective approach."]},

9:{R:{t:"Will universities survive?",
p:["For centuries, getting a degree meant spending three or four years on a [campus|universitet shaharchasi], attending lectures and living in student accommodation. Today, that model is being [challenged|shubha ostiga olinmoq]. Thanks to online platforms, anyone with an internet connection can now take courses from top universities, often for free.",
"Supporters of online learning argue that it is cheaper, more flexible and more [accessible|qulay, hammabop]. A working mother in Namangan, for example, can study data science in the evenings without leaving her job. Some experts predict that by 2040 most students will be taking at least part of their degree online, and that many smaller universities will have closed.",
"Others are less convinced. They point out that the majority of people who start free online courses never finish them. A university, they argue, offers far more than information: it provides [mentoring|ustozlik], networks and the experience of learning alongside others. ‘You can watch a lecture on your phone,’ says one professor, ‘but you can’t have a [debate|munozara] over coffee with it.’ The most likely future, it seems, is a [hybrid|aralash] model that combines the best of both worlds."],
uz:["Asrlar davomida diplom olish uch-to‘rt yilni universitet shaharchasida o‘tkazish, ma’ruzalarga qatnashish va talabalar turar joyida yashashni anglatgan. Bugun bu model shubha ostiga olinmoqda. Onlayn platformalar tufayli internetga ulangan har bir kishi endi yetakchi universitetlarning kurslarini, ko‘pincha bepul o‘tishi mumkin.","Onlayn ta’lim tarafdorlari u arzonroq, moslashuvchanroq va hammabopligini ta’kidlaydi. Masalan, Namangandagi ishlaydigan ona ishini tark etmasdan kechqurunlari ma’lumotlar ilmini o‘rganishi mumkin. Ba’zi mutaxassislar 2040-yilga kelib ko‘pchilik talabalar diplomining hech bo‘lmasa bir qismini onlayn o‘qiyotgan bo‘lishini va ko‘plab kichik universitetlar yopilgan bo‘lishini bashorat qiladi.","Boshqalar bunga unchalik ishonmaydi. Ular bepul onlayn kurslarni boshlaganlarning aksariyati ularni hech qachon tugatmasligini ta’kidlaydi. Ularning fikricha, universitet ma’lumotdan ancha ko‘proq narsani beradi: ustozlik, aloqalar va boshqalar bilan birga o‘qish tajribasi. «Ma’ruzani telefoningizda ko‘rishingiz mumkin, — deydi bir professor, — lekin u bilan qahva ustida munozara qila olmaysiz.» Ko‘rinishidan, eng ehtimoliy kelajak — ikkala dunyoning eng yaxshi tomonlarini birlashtirgan aralash model."],
tf:[["Online courses from top universities are often free.",true],["Most people who start free online courses finish them.",false],["Some experts think many smaller universities will have closed by 2040.",true],["The professor believes online lectures can replace debate completely.",false]],
q:[["Which advantage of online learning is NOT mentioned?","better exam results","lower cost","flexibility"],["What do critics say universities offer besides information?","mentoring, networks and shared experience","cheaper accommodation","free coffee"],["What future does the writer think is most likely?","a hybrid model","only online learning","only traditional campuses"]],
fw:[["hammabop","accessible"],["ustozlik","mentoring"],["munozara","debate"],["aralash","hybrid"]]},

m:{h:"Report: Online learning at our college",l:["The following report outlines students’ experience of online courses and makes recommendations for the future.","Of course, the main advantage reported was flexibility. For instance, 70% of respondents said they could combine study with part-time work.","Nevertheless, a significant number felt isolated. It follows that some form of face-to-face contact is still essential.","In addition, many students complained about technical problems. As a consequence, they often missed parts of lectures.","In light of these findings, it is recommended that the college introduces a hybrid model and improves technical support."]},

10:{R:{t:"Paying with time",
p:["Imagine a bank where the only currency is time. You spend an hour teaching someone English, and in return you [earn|ishlab topmoq] an hour that you can ‘spend’ on any service offered by another member – a haircut, a plumbing repair or a lesson in cooking plov. Everyone’s time is [valued|baholanmoq] equally, irrespective of whether they are a doctor or a student.",
"This is the idea behind timebanking, which was popularized in the USA in the 1980s and has since spread to dozens of countries. It is particularly attractive to people who struggle to make ends meet, since it allows them to get help without [forking out|pul to‘lamoq] money they don’t have. Supporters say it also builds stronger communities, as neighbours who might never have spoken now regularly help each other.",
"There are [drawbacks|kamchiliklar], of course. Some members end up giving far more hours than they receive, while skilled professionals may feel they are getting a raw deal. Running a timebank also requires a [coordinator|muvofiqlashtiruvchi], which costs money. Nevertheless, in an age when many services are becoming impersonal and [cashless|naqd pulsiz], the idea of exchanging time rather than money seems surprisingly modern."],
uz:["Yagona valyutasi vaqt bo‘lgan bankni tasavvur qiling. Siz kimgadir bir soat ingliz tilini o‘rgatasiz va evaziga boshqa a’zo taklif qiladigan har qanday xizmatga — soch oldirish, santexnika ta’miri yoki palov pishirish darsiga «sarflash» mumkin bo‘lgan bir soatni ishlab topasiz. Shifokor bo‘lasizmi yoki talaba — farqi yo‘q, hammaning vaqti teng baholanadi.","Bu 1980-yillarda AQShda ommalashgan va shundan beri o‘nlab mamlakatlarga tarqalgan «vaqt banki»ning asosiy g‘oyasidir. U ayniqsa uchma-uch yashaydigan odamlar uchun jozibali, chunki ularga yo‘q pulni to‘lamasdan yordam olish imkonini beradi. Tarafdorlarning aytishicha, u mustahkamroq jamoalarni ham shakllantiradi, chunki hech qachon gaplashmagan bo‘lishi mumkin bo‘lgan qo‘shnilar endi muntazam bir-biriga yordam beradi.","Albatta, kamchiliklar ham bor. Ba’zi a’zolar olganidan ancha ko‘p soat berib qo‘yadi, malakali mutaxassislar esa o‘zlariga nisbatan adolatsizlik bo‘layotgandek his qilishi mumkin. Vaqt bankini yuritish uchun muvofiqlashtiruvchi ham kerak, bu esa pul talab qiladi. Shunga qaramay, ko‘plab xizmatlar shaxssiz va naqd pulsiz bo‘lib borayotgan davrda pul o‘rniga vaqt almashish g‘oyasi hayratlanarli darajada zamonaviy tuyuladi."],
tf:[["In a timebank, a doctor’s hour is worth more than a student’s.",false],["Timebanking was popularized in the USA in the 1980s.",true],["Timebanking can help people who are short of money.",true],["Running a timebank costs nothing.",false]],
q:[["What is the currency in a timebank?","hours of time","small coins","online points that can be sold"],["Which social benefit is mentioned?","Neighbours help each other more.","People earn higher salaries.","Banks lend more money."],["What is the writer’s overall stance?","positive but aware of drawbacks","completely negative","neutral and uninterested"]],
fw:[["ishlab topmoq","earn"],["kamchiliklar","drawbacks"],["muvofiqlashtiruvchi","coordinator"],["naqd pulsiz","cashless"]]},
W:{t:"An email enquiry",uz:"Ma’lumot so‘rash xati (rasmiy)",
err:"I am writing to enquire about your timebank. *Could you tell me what are the membership fees?~Could you tell me what the membership fees are?* I would *appreciate if you could~appreciate it if you could* send me more information.",
m:{h:"Subject: Enquiry about timebank membership",l:["Dear Sir or Madam,","I am writing to enquire about joining the Yunusobod Community Timebank, which I read about on your website.","I would be grateful if you could provide some further information. In particular, I would like to know whether members need any formal qualifications to offer a service.","I would also appreciate it if you could tell me how hours are recorded and whether there is an annual membership fee.","Finally, could you let me know when the next introductory meeting will take place?","Thank you in advance for your help. I look forward to hearing from you.","Yours faithfully,","Aziza Rahimova"]},
ph:["I am writing to enquire about …","I would be grateful if you could …","In particular, I would like to know whether …","I would appreciate it if you could …","Could you let me know when / how / what …","Thank you in advance. I look forward to hearing from you."],

chk:[["Kirish (I am writing to enquire)","writing to enquire|writing to ask"],["Bilvosita savol (Could you tell me / I would like to know whether)","(could you (tell|let)|would like to know|wonder(ing)? (if|whether))"],["Xushmuomala (I would be grateful / appreciate it if)","(grateful|appreciate it)"],["Rasmiy yakun (Yours faithfully / sincerely)","yours\\s+(faithfully|sincerely)"]]}},

11:{R:{t:"The story of plov",
p:["Ask anyone in Uzbekistan where plov comes from and you will probably hear a [legend|afsona]. Some say it was invented by the cooks of Alexander the Great, who needed a [nourishing|to‘yimli] dish for his soldiers. Others credit the great physician Ibn Sina, who is said to have recommended it as a cure for weakness. Whatever the truth, historians agree that dishes of rice cooked with meat and fat have existed along the Silk Road for many centuries.",
"What is certain is plov’s [cultural|madaniy] importance. In 2016, UNESCO added Uzbek plov culture and tradition to its list of Intangible Cultural Heritage. Plov is served at weddings, funerals and celebrations, often cooked in enormous pots by men in the early morning. However many guests arrive, there is always enough.",
"Every region has its own version. In Samarkand the ingredients are [layered|qatlam-qatlam qo‘yilgan] and not mixed, while in Fergana the rice is darker. No matter which recipe you follow, the basic steps are the same: fry the meat, add carrots cut into thin strips, let everything [simmer|past olovda qaynamoq], and finally steam the rice. ‘Plov is not just food,’ says one [oshpaz|palov ustasi]. ‘It’s a way of bringing people together.’"],
uz:["O‘zbekistonda kimdan palov qayerdan kelib chiqqanini so‘ramang, ehtimol bir afsonani eshitasiz. Ba’zilar uni askarlari uchun to‘yimli taom kerak bo‘lgan Iskandar Zulqarnaynning oshpazlari ixtiro qilgan deyishadi. Boshqalar buni buyuk tabib Ibn Sinoga bog‘laydi, u palovni holsizlikka davo sifatida tavsiya qilgan deyiladi. Haqiqat qanday bo‘lishidan qat’i nazar, tarixchilar go‘sht va yog‘ bilan pishirilgan guruch taomlari Ipak yo‘li bo‘ylab ko‘p asrlardan beri mavjud bo‘lganiga qo‘shiladi.","Palovning madaniy ahamiyati esa shubhasiz. 2016-yilda YUNESKO o‘zbek palovi madaniyati va an’analarini Nomoddiy madaniy meros ro‘yxatiga kiritdi. Palov to‘ylarda, ma’rakalarda va bayramlarda tortiladi, ko‘pincha erta tongda erkaklar tomonidan ulkan qozonlarda pishiriladi. Qancha mehmon kelmasin, osh har doim yetadi.","Har bir viloyatning o‘z varianti bor. Samarqandda masalliqlar qatlam-qatlam qo‘yiladi va aralashtirilmaydi, Farg‘onada esa guruch to‘qroq rangda bo‘ladi. Qaysi retseptga amal qilmang, asosiy bosqichlar bir xil: go‘shtni qovuring, ingichka somoncha qilib to‘g‘ralgan sabzini qo‘shing, hammasini past olovda qaynating va nihoyat guruchni dimlang. «Palov shunchaki taom emas, — deydi bir oshpaz. — Bu odamlarni birlashtirish usuli.»"],
tf:[["Historians are certain that Ibn Sina invented plov.",false],["UNESCO recognized Uzbek plov culture in 2016.",true],["In Samarkand, the ingredients are mixed together.",false],["Plov is often cooked by men early in the morning.",true]],
q:[["What do historians agree on?","Rice dishes with meat existed on the Silk Road for centuries.","Alexander the Great invented plov.","Plov was first cooked in Fergana."],["What is different about Fergana plov?","The rice is darker.","It has no carrots.","It is cooked in small pots."],["According to the cook, plov is…","a way of bringing people together","only for weddings","too difficult to cook at home"]],
fw:[["afsona","legend"],["to‘yimli","nourishing"],["madaniy","cultural"],["qatlam-qatlam qo‘yilgan","layered"]]},

m:{h:"48 hours in Bukhara: my food diary",l:["So, here I am in Bukhara, and I have to say – I’m in love with this city!","First stop: breakfast at a tiny café near Lyabi-Hauz. The non was so fresh it was still warm, and the green tea just kept coming.","By the way, whatever you do, don’t leave without trying the local samsa. Baked in a clay oven, they’re crispy on the outside and wonderfully juicy inside.","In the evening I joined a cooking class. Our teacher showed us how to chop carrots into perfect thin strips – easier said than done, believe me!","All in all, if you know what I mean, this is a place that feeds your soul as well as your stomach. More photos tomorrow!"]},

12:{R:{t:"The memory palace",
p:["According to an ancient Greek legend, the poet Simonides was the only survivor when the roof of a banquet hall collapsed. The bodies of the guests were so badly [crushed|ezilib ketgan] that nobody could identify them. Simonides, however, realized that he could remember exactly where each person had been sitting, and so he was able to name them all.",
"This story is said to have inspired the ‘memory palace’ technique, which is still used by memory champions today. You imagine a building you know well – your home, for example – and ‘place’ the items you want to remember in different rooms. To recall them, you simply take a mental walk through the building. The more [bizarre|g‘aroyib] the images, the better: a donkey sitting in your bath is far more [memorable|esda qoladigan] than a shopping list.",
"Scientific studies broadly support the method. In one experiment, participants who had trained with the technique for six weeks were able to remember substantially more words than a control group, and they [retained|saqlab qolmoq] this ability four months later. Researchers acknowledge, however, that it takes time to master. As one champion puts it: ‘Nobody is born with a great memory. You have to [build|qurmoq] one, room by room.’"],
uz:["Qadimgi yunon afsonasiga ko‘ra, ziyofat zalining tomi qulaganda faqat shoir Simonid tirik qolgan. Mehmonlarning jasadlari shunchalik ezilib ketgan ediki, hech kim ularni taniy olmagan. Biroq Simonid har bir kishi aynan qayerda o‘tirganini eslay olishini angladi va shu tariqa hammasining ismini aytib berdi.","Aytishlaricha, bu voqea bugungi kunda ham xotira chempionlari foydalanadigan «xotira saroyi» usuliga ilhom bergan. Siz yaxshi biladigan binoni — masalan, uyingizni tasavvur qilasiz va eslab qolmoqchi bo‘lgan narsalarni turli xonalarga «joylashtirasiz». Ularni eslash uchun shunchaki bino bo‘ylab xayolan sayr qilasiz. Tasvirlar qanchalik g‘aroyib bo‘lsa, shuncha yaxshi: vannangizda o‘tirgan eshak xarid ro‘yxatidan ancha yaxshiroq esda qoladi.","Ilmiy tadqiqotlar bu usulni umuman olganda qo‘llab-quvvatlaydi. Bir tajribada olti hafta davomida bu usul bilan mashq qilgan ishtirokchilar nazorat guruhiga qaraganda sezilarli darajada ko‘proq so‘zni eslab qolgan va bu qobiliyatni to‘rt oydan keyin ham saqlab qolgan. Biroq tadqiqotchilar uni o‘zlashtirish vaqt talab qilishini tan olishadi. Bir chempion aytganidek: «Hech kim ajoyib xotira bilan tug‘ilmaydi. Uni xonama-xona qurish kerak.»"],
tf:[["Simonides survived the collapse of a banquet hall.",true],["In the technique, you place items in rooms of an imaginary building.",true],["Ordinary images work better than bizarre ones.",false],["The participants forgot the method after four months.",false]],
q:[["How did Simonides identify the guests?","He remembered where each person had been sitting.","He recognized their clothes.","He asked their families."],["How do you recall items using the memory palace?","by taking a mental walk through the building","by writing them down","by repeating them aloud"],["What did the experiment show?","Trained participants remembered more and kept the ability.","The method only works for champions.","The method works immediately without practice."]],
fw:[["g‘aroyib","bizarre"],["esda qoladigan","memorable"],["saqlab qolmoq","retained"],["ezilib ketgan","crushed"]]},
W:{t:"A magazine story",uz:"Jurnal uchun hikoya",
err:"Last summer I *had stolen my bag~had my bag stolen* on the beach. A local boy *suggested me to call~suggested that I call* the police. I *got him help~got him to help* me search.",
m:{h:"The stranger who remembered everything",l:["It was the last day of our holiday in Samarkand, and I had just realized something terrible: I had left my passport in a taxi.","Panic set in. I couldn’t remember the driver’s name, the colour of the car – nothing. My mind had gone completely blank.","Then an elderly man sitting outside a teahouse called me over. ‘Silver car, number ending in 47, the driver had a red cap,’ he said calmly. ‘He always goes to the station after lunch.’","Sure enough, we found the taxi there, and my passport was still on the back seat.","When I thanked him, the old man just smiled. ‘I used to be a teacher,’ he explained. ‘You notice things when you’ve spent forty years watching children.’","Before we left, I had my photo taken with him outside the teahouse – a memory I will never forget."]},
ph:["It was … when …","I had just realized that …","Panic set in. / My mind had gone blank.","Then, … / Sure enough, …","Dialog: ‘…,’ he said calmly.","Yakun: kutilmagan burilish yoki saboq"],

UNITS.forEach((u,i)=>{
  u.c=COLORS[i];
  u.words=u.W.split(';').map(x=>{const [en,uz]=x.split('|');return{en,uz}});
  const r=rng(u.n*97+13);
  u.mcq=shuf(u.words,r).slice(0,8).map(w=>{const others=shuf(u.words.filter(x=>x!==w),r).slice(0,2);return{p:w.uz,o:shuf([w.en,...others.map(o=>o.en)],r),a:w.en}});
  u.typ=shuf(u.words.filter(w=>w.en.length<=16&&!/[\/(]/.test(w.en)),r).slice(0,6);
  u.gap=u.G.map(([s,a])=>{const others=shuf(u.G.filter(g=>g[1]!==a).map(g=>g[1]),r).slice(0,2);return{s,a,o:shuf([a,...others],r)}});
  u.gr.forEach(g=>g.mm=g.m.map(([p,...o])=>({p,a:o[0],o:shuf(o,r)})));
  u.bb=u.b.map(([uz,en])=>({uz,en,t:shuf(en.split(' '),r)}));
  // tasks: id -> number of items
  u.tasks={match:u.words.length,mc:u.mcq.length,type:u.typ.length,gap:u.gap.length,g0:u.gr[0].f.length+u.gr[0].m.length,g1:u.gr[1].f.length+u.gr[1].m.length,rtf:4,rq:3,rfw:4,werr:1,wtext:1,build:u.bb.length};
});
const TOTAL=UNITS.length*12;
const k=(u,t,i)=>`${u.n}-${t}-${i}`;
const isDone=(u,t,i)=>!!S.done[k(u,t,i)];
const taskDone=(u,t)=>{for(let i=0;i<u.tasks[t];i++)if(!isDone(u,t,i))return false;return true};
const unitCount=u=>Object.keys(u.tasks).filter(t=>taskDone(u,t)).length;
const allCount=()=>UNITS.reduce((s,u)=>s+unitCount(u),0);
function mark(u,t,i){S.done[k(u,t,i)]=1;save();refreshStatus(u)}

const head=document.getElementById('head'),app=document.getElementById('app');

function home(){
  head.innerHTML=`<h1>Ingliz tili · Uy vazifasi <small>Homework</small></h1><p>Navigate C1 Advanced · 12 unit · Lug‘at, o‘qish, grammatika va yozuv</p>`;
  const c=allCount();
  app.innerHTML=`<div class="card"><label class="h" for="nm">Ismingiz / Your name</label>
  <input type="text" id="nm" placeholder="Ismingizni yozing" value="${esc(S.name)}">
  <div class="bar"><i style="width:${c/TOTAL*100}%"></i></div><div class="meta">Umumiy natija: ${c} / ${TOTAL} topshiriq</div></div>`+
  UNITS.map(u=>{const d=unitCount(u);return`<button class="card unit" style="--c:${u.c}" data-u="${u.n}">
  <div class="k">${u.n}-UNIT · Unit ${u.n}</div><h2>${esc(u.t)} <span>${esc(u.uz)}</span></h2>
  <div class="tp"><b>Lug‘at:</b> ${esc(u.v)}<br><b>Grammatika:</b> ${esc(u.g)}<br><b>O‘qish:</b> ${esc(RW[u.n].R.t)} · <b>Yozuv:</b> ${esc(RW[u.n].W.t)}</div>
  <div class="bar"><i style="width:${d/12*100}%"></i></div><div class="meta">${d} / 12 topshiriq bajarildi</div></button>`}).join('')+
  `<div style="text-align:center"><button class="reset" id="rs">Natijalarni tozalash</button></div>`;
  document.getElementById('nm').oninput=e=>{S.name=e.target.value;save()};
  app.querySelectorAll('.unit').forEach(b=>b.onclick=()=>location.hash='u'+b.dataset.u+'-vocab');
  const rs=document.getElementById('rs');let armed=false;
  rs.onclick=()=>{if(!armed){armed=true;rs.textContent='Ishonchingiz komilmi? Yana bir marta bosing';return}S.done={};save();home()};
}

const st=(u,t)=>{const n=u.tasks[t];let d=0;for(let i=0;i<n;i++)if(isDone(u,t,i))d++;return`<span class="st ${d===n?'done':''}" data-st="${u.n}-${t}">${d===n?'✓ Bajarildi':d+' / '+n}</span>`};
function refreshStatus(u){
  document.querySelectorAll('[data-st]').forEach(el=>{const [n,t]=el.dataset.st.split('-');const uu=UNITS[n-1];const tmp=document.createElement('div');tmp.innerHTML=st(uu,t);el.replaceWith(tmp.firstChild)});
  const m=document.getElementById('uprog');if(m)m.textContent=`${unitCount(u)} / 12 topshiriq bajarildi`;
}

function unit(n,tab){
  const u=UNITS[n-1];if(!u){home();return}
  head.innerHTML=`<div class="nav"><button class="pill" id="bk">← Barcha unitlar</button>${n>1?`<button class="pill" data-go="${n-1}">‹ ${n-1}-unit</button>`:''}${n<12?`<button class="pill" data-go="${n+1}">${n+1}-unit ›</button>`:''}</div>
  <h1>${n}-unit · ${esc(u.t)} <span class="uz">${esc(u.uz)}</span></h1><p id="uprog">${unitCount(u)} / 12 topshiriq bajarildi</p>`;
  head.parentElement.style.background=u.c;
  document.getElementById('bk').onclick=()=>location.hash='';
  head.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>location.hash='u'+b.dataset.go+'-'+tab);
  app.innerHTML=`<div class="tabs"><button class="tab ${tab==='vocab'?'on':''}" data-t="vocab">Lug‘at</button><button class="tab ${tab==='reading'?'on':''}" data-t="reading">O‘qish</button><button class="tab ${tab==='grammar'?'on':''}" data-t="grammar">Grammatika</button><button class="tab ${tab==='writing'?'on':''}" data-t="writing">Yozuv</button></div><div id="body"></div>`;
  app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>location.hash='u'+n+'-'+b.dataset.t);
  const body=document.getElementById('body');
  ({vocab,reading,grammar,writing})[tab](u,body);
  window.scrollTo(0,0);
}

function fillQ(u,t,i,prompt,answers,hint){
  const done=isDone(u,t,i);const alts=answers.split('|');
  return`<div class="q" data-fill="${t}|${i}"><div class="p"><b>${i+1}</b>${esc(prompt)}</div>
  <div class="row"><input type="text" aria-label="Javob" placeholder="Javob" autocomplete="off" autocapitalize="off" spellcheck="false" class="${done?'ok':''}" value="${done?esc(alts[0]):''}">
  <button class="btn">Tekshirish</button><button class="btn o">Yordam</button></div><div class="fb ${done?'g':''}">${done?'✓ To‘g‘ri':''}</div></div>`;
}
function mcQ(u,t,i,num,prompt,opts,ans){
  const done=isDone(u,t,i);
  return`<div class="q" data-mc="${t}|${i}" data-a="${esc(ans)}"><div class="p"><b>${num}</b>${esc(prompt)}</div><div class="opts">${opts.map(o=>`<button class="opt ${done&&o===ans?'ok':''}">${esc(o)}</button>`).join('')}</div></div>`;
}
function bind(u,root,answersFor){
  root.querySelectorAll('[data-fill]').forEach(q=>{
    const [t,i]=q.dataset.fill.split('|');const {ans,hint}=answersFor(t,+i);
    const inp=q.querySelector('input'),fb=q.querySelector('.fb'),[chk,help]=q.querySelectorAll('button');
    const check=()=>{const v=norm(inp.value);if(!v)return;
      const okk=ans.split('|').some(a=>norm(a)===v);
      inp.classList.toggle('ok',okk);inp.classList.toggle('bad',!okk);
      fb.className='fb '+(okk?'g':'r');fb.textContent=okk?'✓ To‘g‘ri':'✗ Yana urinib ko‘ring';
      if(okk)mark(u,t,+i)};
    chk.onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
    help.onclick=()=>{fb.className='fb';fb.innerHTML=(hint?esc(hint)+' → ':'')+'Javob: <b>'+esc(ans.split('|')[0])+'</b>'};
  });
  root.querySelectorAll('[data-mc]').forEach(q=>{
    const [t,i]=q.dataset.mc.split('|');const a=q.dataset.a;
    q.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      q.querySelectorAll('.opt').forEach(x=>x.classList.remove('bad'));
      if(b.textContent===a){b.classList.add('ok');mark(u,t,+i)}else b.classList.add('bad');
    });
  });
}

function vocab(u,body){
  const stages=[];for(let i=0;i<u.words.length;i+=6)stages.push(i);
  body.innerHTML=`<div class="card"><h3>So‘zlar banki</h3><div class="ins">So‘zni bosing — talaffuzini eshitasiz.</div>
  <div class="bank">${u.words.map(w=>`<button class="w" data-say="${esc(w.en)}"><b>${esc(w.en)}</b><span>${esc(w.uz)}</span></button>`).join('')}</div></div>
  <div class="card"><h3>So‘z va ma’nosini juftlang ${st(u,'match')}</h3><div class="ins">Chapdan inglizcha so‘zni, o‘ngdan uning ma’nosini bosing. ${stages.length} bosqich.</div>
  ${stages.map((s,si)=>{const r=rng(u.n*31+si);const grp=u.words.slice(s,s+6).map((w,j)=>({...w,i:s+j}));
    return`<div class="stage">${si+1}-bosqich / ${stages.length}</div><div class="mt" data-stage><div>${shuf(grp,r).map(w=>`<button class="mb ${isDone(u,'match',w.i)?'ok':''}" data-l="${w.i}">${esc(w.en)}</button>`).join('')}</div><div>${shuf(grp,r).map(w=>`<button class="mb ${isDone(u,'match',w.i)?'ok':''}" data-r="${w.i}">${esc(w.uz)}</button>`).join('')}</div></div>`}).join('')}</div>
  <div class="card"><h3>O‘zbekchaga mos so‘z ${st(u,'mc')}</h3><div class="ins">To‘g‘ri inglizcha so‘zni tanlang.</div>
  ${u.mcq.map((q,i)=>mcQ(u,'mc',i,i+1,q.p,q.o,q.a)).join('')}</div>
  <div class="card"><h3>So‘zni yozing ${st(u,'type')}</h3><div class="ins">O‘zbekcha ma’nosiga qarab inglizcha yozing. Qiynalsangiz «Yordam»ni bosing.</div>
  ${u.typ.map((w,i)=>fillQ(u,'type',i,w.uz,w.en)).join('')}</div>
  <div class="card"><h3>Gapda ishlating ${st(u,'gap')}</h3><div class="ins">Bo‘sh joyga mos so‘zni tanlang.</div>
  ${u.gap.map((g,i)=>mcQ(u,'gap',i,i+1,g.s,g.o,g.a)).join('')}</div>
  <button class="btn next" id="nx">Keyingisi: O‘qish →</button>`;
  body.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));
  body.querySelectorAll('[data-stage]').forEach(m=>{let sel=null;
    m.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{if(b.classList.contains('ok'))return;m.querySelectorAll('[data-l]').forEach(x=>x.classList.remove('sel'));sel=b;b.classList.add('sel');speak(b.textContent)});
    m.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(!sel||b.classList.contains('ok'))return;
      if(sel.dataset.l===b.dataset.r){sel.classList.remove('sel');sel.classList.add('ok');b.classList.add('ok');mark(u,'match',+b.dataset.r);sel=null}
      else{b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),600)}});
  });
  bind(u,body,(t,i)=>({ans:u.typ[i].en,hint:''}));
  document.getElementById('nx').onclick=()=>location.hash='u'+u.n+'-reading';
}

function grammar(u,body){
  body.innerHTML=u.gr.map((g,gi)=>{const t='g'+gi;const nf=g.f.length;
    return`<div class="card"><h3>${esc(g.t)} ${st(u,t)}</h3><div class="ins">Qoidani o‘qing, shaklga keltiring, keyin to‘g‘ri gapni tanlang.</div>
    <div class="rule">${g.r}</div>
    ${g.f.map((f,i)=>fillQ(u,t,i,f[0],f[1],f[2])).join('')}
    ${g.mm.map((m,i)=>mcQ(u,t,nf+i,nf+i+1,m.p,m.o,m.a)).join('')}</div>`}).join('')+
  `<div class="card"><h3>Gap tuzing ${st(u,'build')}</h3><div class="ins">So‘zlarni bosib, to‘g‘ri tartibda gap tuzing.</div>
  ${u.bb.map((b,i)=>`<div class="q" data-build="${i}"><div class="p"><b>${i+1}</b>${esc(b.uz)}</div>
  <div class="zone">${isDone(u,'build',i)?b.en.split(' ').map(w=>`<span class="tok">${esc(w)}</span>`).join(''):''}</div>
  <div class="row" style="margin-bottom:8px">${b.t.map((w,j)=>`<button class="tok ${isDone(u,'build',i)?'used':''}" data-j="${j}">${esc(w)}</button>`).join('')}</div>
  <div class="row"><button class="btn">Tekshirish</button><button class="btn o">Tozalash</button></div><div class="fb ${isDone(u,'build',i)?'g':''}">${isDone(u,'build',i)?'✓ To‘g‘ri':''}</div></div>`).join('')}</div>
  <button class="btn next" id="nx">Keyingisi: Yozuv →</button>`;
  bind(u,body,(t,i)=>{const g=u.gr[+t[1]];return{ans:g.f[i][1],hint:g.f[i][2]}});
  body.querySelectorAll('[data-build]').forEach(q=>{
    const i=+q.dataset.build,b=u.bb[i],zone=q.querySelector('.zone'),fb=q.querySelector('.fb');
    const [chk,clr]=q.querySelectorAll('.btn');
    q.querySelectorAll('[data-j]').forEach(t=>t.onclick=()=>{if(t.classList.contains('used'))return;t.classList.add('used');
      const s=document.createElement('button');s.className='tok';s.textContent=t.textContent;s.onclick=()=>{s.remove();t.classList.remove('used')};zone.appendChild(s)});
    chk.onclick=()=>{const v=[...zone.children].map(x=>x.textContent).join(' ');
      const okk=norm(v)===norm(b.en);fb.className='fb '+(okk?'g':'r');fb.textContent=okk?'✓ To‘g‘ri':'✗ Tartib noto‘g‘ri, qayta urinib ko‘ring';
      if(okk){mark(u,'build',i);speak(b.en)}};
    clr.onclick=()=>{zone.innerHTML='';q.querySelectorAll('[data-j]').forEach(t=>t.classList.remove('used'));fb.textContent=''};
  });
  document.getElementById('nx').onclick=()=>location.hash='u'+u.n+'-writing';
}

const glossHtml=p=>esc(p).replace(/\[([^|\]]+)\|([^\]]+)\]/g,(m,w,t)=>`<button class="gl">${w}<small>(${t})</small></button>`);
const plain=p=>p.replace(/\[([^|\]]+)\|[^\]]+\]/g,'$1');
function reading(u,body){
  const R=RW[u.n].R;
  body.innerHTML=`<div class="card"><h3>${esc(R.t)}</h3><div class="ins">Matnni o‘qing. Tagiga chizilgan so‘zlarni bosing — tarjimasi chiqadi.</div>
  <div class="txt">${R.p.map(p=>`<p>${glossHtml(p)}</p>`).join('')}</div>
  <button class="btn o" id="say">🔊 Matnni tinglash</button>
  <details><summary>O‘zbekcha tarjima</summary>${R.uz.map(p=>`<p>${esc(p)}</p>`).join('')}</details></div>
  <div class="card"><h3>True or False? · To‘g‘ri yoki noto‘g‘ri? ${st(u,'rtf')}</h3><div class="ins">Matn bo‘yicha belgilang.</div>
  ${R.tf.map(([s,v],i)=>{const a=v?'True ✓':'False ✗',done=isDone(u,'rtf',i);return`<div class="q" data-mc="rtf|${i}" data-a="${a}"><div class="p"><b>${i+1}</b>${esc(s)}</div><div class="tf">${['True ✓','False ✗'].map(o=>`<button class="opt ${done&&o===a?'ok':''}">${o}</button>`).join('')}</div></div>`}).join('')}</div>
  <div class="card"><h3>Savollarga javob bering ${st(u,'rq')}</h3><div class="ins">Matn bo‘yicha javobni tanlang.</div>
  ${R.q.map(([p,...o],i)=>{const r=rng(u.n*53+i);return mcQ(u,'rq',i,i+1,p,shuf(o,r),o[0])}).join('')}</div>
  <div class="card"><h3>Matndan so‘zni toping ${st(u,'rfw')}</h3><div class="ins">Matndagi mos so‘z yoki iborani inglizcha yozing.</div>
  ${R.fw.map(([uz,en],i)=>fillQ(u,'rfw',i,uz,en)).join('')}</div>
  <button class="btn next" id="nx">Keyingisi: Grammatika →</button>`;
  body.querySelectorAll('.gl').forEach(b=>b.onclick=()=>{b.classList.toggle('on');speak(b.firstChild.textContent)});
  const sb=document.getElementById('say');let on=false;
  sb.onclick=()=>{try{if(on){speechSynthesis.cancel();on=false;sb.textContent='🔊 Matnni tinglash';return}
    const ut=new SpeechSynthesisUtterance(R.p.map(plain).join(' '));ut.lang='en-GB';ut.rate=.9;ut.onend=()=>{on=false;sb.textContent='🔊 Matnni tinglash'};
    speechSynthesis.cancel();speechSynthesis.speak(ut);on=true;sb.textContent='⏹ To‘xtatish'}catch(e){}};
  bind(u,body,(t,i)=>({ans:R.fw[i][1],hint:''}));
  document.getElementById('nx').onclick=()=>location.hash='u'+u.n+'-grammar';
}
function writing(u,body){
  const W=RW[u.n].W;
  const segs=[];W.err.replace(/\*([^*~]+)~([^*]+)\*|(\S+)/g,(m,w,f,p)=>{segs.push(p?{w:p}:{w,f});return m});
  const nErr=segs.filter(x=>x.f).length,eDone=isDone(u,'werr',0);
  const txt=(S.texts&&S.texts[u.n])||'';
  body.innerHTML=`<h2 class="wt">${esc(W.t)}<span>${esc(W.uz)}</span></h2>
  <div class="card"><h3>1-qadam · Xatolarni toping ${st(u,'werr')}</h3><div class="ins">Xato yozilgan so‘z yoki qismlarni bosing (jami ${nErr} ta), keyin «Tekshirish»ni bosing.</div>
  <div class="errs">${segs.map((x,i)=>`<button class="et" data-i="${i}">${esc(x.w)}${eDone&&x.f?`<span class="fx">→ ${esc(x.f)}</span>`:''}</button>`).join('')}</div>
  <button class="btn" id="ec">Tekshirish</button><div class="fb" id="ef"></div></div>
  <div class="card"><h3>2-qadam · Namunani o‘qing</h3><div class="ins">Tuzilish va foydali iboralarga e’tibor bering.</div>
  <div class="model"><b>${esc(W.m.h)}</b>${W.m.l.map(l=>`<p>${esc(l)}</p>`).join('')}</div>
  <div class="ph">${W.ph.map(p=>`<span>${esc(p)}</span>`).join('')}</div></div>
  <div class="card"><h3>3-qadam · Navbat sizda ✍️ ${st(u,'wtext')}</h3><div class="ins">${esc(W.task)}</div>
  <textarea id="ta" placeholder="Shu yerga ingliz tilida yozing…">${esc(txt)}</textarea>
  <div class="meta" id="wc"></div><ul class="chk" id="ck"></ul>
  <button class="btn" id="cp">📋 Nusxa olib, o‘qituvchiga yuborish</button>
  <div class="meta" id="cpm" style="margin-top:8px">Matningiz shu qurilmada saqlanadi. Tugma ismingiz, matningiz va natijangizni nusxalaydi — keyin uni o‘qituvchingizga yuboring.</div></div>
  ${u.n<12?`<button class="btn next" id="nx">Keyingi unit: ${u.n+1}-unit →</button>`:`<button class="btn next" id="nx">← Barcha unitlar</button>`}`;
  body.querySelectorAll('.et').forEach(b=>b.onclick=()=>b.classList.toggle('sel'));
  document.getElementById('ec').onclick=()=>{const ef=document.getElementById('ef');
    const sel=[...body.querySelectorAll('.et.sel')].map(b=>+b.dataset.i);
    const right=segs.map((x,i)=>x.f?i:-1).filter(i=>i>=0);
    const found=sel.filter(i=>right.includes(i)).length,wrong=sel.length-found;
    if(found===right.length&&!wrong){ef.className='fb g';ef.textContent='✓ Barakalla! Hamma xatolar topildi.';
      body.querySelectorAll('.et').forEach(b=>{const x=segs[+b.dataset.i];if(x.f&&!b.querySelector('.fx'))b.insertAdjacentHTML('beforeend',`<span class="fx">→ ${esc(x.f)}</span>`)});mark(u,'werr',0)}
    else{ef.className='fb r';ef.textContent=`✗ ${found} / ${right.length} ta xato topildi${wrong?`, ${wrong} ta to‘g‘ri so‘z belgilangan`:''}. Qayta urinib ko‘ring.`}};
  const ta=document.getElementById('ta'),wc=document.getElementById('wc'),ck=document.getElementById('ck');
  const words=t=>(t.match(/[A-Za-z’'-]+/g)||[]).length;
  const upd=()=>{const t=ta.value,n=words(t);
    wc.textContent=`${n} ta so‘z (maqsad: ${W.min}–${W.max})`;
    ck.innerHTML=`<li class="${n>=W.min?'y':''}">${n>=W.min?'✓':'○'} Kamida ${W.min} ta so‘z</li>`+W.chk.map(([l,r])=>{let ok=false;try{ok=n>0&&new RegExp(r,'im').test(t)}catch(e){}return`<li class="${ok?'y':''}">${ok?'✓':'○'} ${esc(l)}</li>`}).join('');
    S.texts=S.texts||{};S.texts[u.n]=t;save();
    if(n>=W.min&&!isDone(u,'wtext',0))mark(u,'wtext',0)};
  ta.oninput=upd;upd();
  document.getElementById('cp').onclick=()=>{
    const out=`Ism: ${S.name||'-'}\n${u.n}-unit · ${u.t} — ${W.t}\nNatija: ${unitCount(u)} / 12 topshiriq\n\n${ta.value}`;
    const m=document.getElementById('cpm');
    const fallback=()=>{ta.focus();ta.select();m.textContent='Nusxa olinmadi — matn belgilandi, uni o‘zingiz nusxalang (Ctrl+C).'};
    try{navigator.clipboard.writeText(out).then(()=>m.textContent='✓ Nusxa olindi! Endi o‘qituvchingizga yuboring.',fallback)}catch(e){fallback()}};
  document.getElementById('nx').onclick=()=>location.hash=u.n<12?'u'+(u.n+1)+'-vocab':'';
}

function route(){const m=location.hash.match(/^#u(\d+)-(vocab|reading|grammar|writing)$/);
  if(m)unit(+m[1],m[2]);else{head.parentElement.style.background='';home();}}
window.addEventListener('hashchange',route);route();
}
</script>
</body>
</html>
